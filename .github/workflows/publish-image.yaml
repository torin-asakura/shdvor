name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  run:
    name: Release
    uses: atls/shared/.github/workflows/pack-image.yaml@master
    permissions:
      contents: read
      packages: write
    with:
      registryURL: ghcr.io
      registryUser: ${{ github.actor }}
      project: ${{ github.repository_owner }}
      imageNamePrefix: shdvor-
      include: ${{ github.event_name == 'workflow_dispatch' && '@site/app,@blog/app,@prices/service-entrypoint' || '' }}
      tagPolicy: revision
    secrets:
      registryKey: ${{ secrets.GITHUB_TOKEN }}
